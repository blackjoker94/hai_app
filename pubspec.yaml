name: hai_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  cached_network_image: ^3.4.1
  camera: ^0.11.2
  cloud_firestore: ^5.6.5
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  curved_nav_bar: ^0.0.2
  dio: ^5.9.1
  dotted_border: ^3.1.0
  easy_stepper: ^0.9.1
  equatable: ^2.0.7
  firebase_auth: ^5.5.1
  firebase_core: ^3.12.1
  firebase_storage: ^12.4.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  flutter_local_notifications: ^19.4.2
  flutter_localization: ^0.3.3
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.2.4
  geolocator: ^14.0.2
  get_it: ^8.2.0
  google_generative_ai: ^0.4.7
  google_mlkit_face_detection: ^0.13.2
  hive_flutter: ^1.1.0
  http: ^1.6.0
  image: ^4.8.0
  image_picker: ^1.2.0
  injectable: ^2.5.2
  json_annotation: ^4.10.0
  path_provider: ^2.1.5
  pretty_dio_logger: ^1.4.0
  tflite_flutter: ^0.12.1

dev_dependencies:
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.6.1
  json_serializable: ^6.8.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env
    - assets/fonts/
    - assets/LightModel.tflite
    - assets/mobilefacenet.tflite
    - assets/labels.txt

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
